<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversazioni — HyperSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cockpit.css">
<style>
  .subbar { max-width: 980px; margin: 16px auto 0; padding: 0 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .subbar h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .dot.off { background: var(--error); }
  .count { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.76rem; margin-left: auto; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 20px 44px; }
  .turn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }
  .meta { display: flex; gap: 8px; align-items: center; font-size: 0.74rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 8px; flex-wrap: wrap; }
  .badge { padding: 2px 7px; border-radius: 4px; background: var(--info-bg); color: var(--info); border: 1px solid rgba(56,189,248,.25); font-weight: 600; text-transform: uppercase; font-size: 0.68rem; }
  .msg { background: var(--surface2); border-left: 2px solid var(--border-strong); padding: 7px 10px; border-radius: 4px; margin: 6px 0; }
  .msg .author { color: var(--primary); font-family: var(--font-mono); font-size: 0.74rem; font-weight: 600; }
  .msg .txt { font-size: 0.88rem; margin-top: 2px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .reply { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--primary-bg); border: 1px solid rgba(16,185,129,.25); }
  .reply .lbl { font-size: 0.68rem; font-family: var(--font-mono); color: var(--primary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .reply .txt { font-size: 0.88rem; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .wait { color: var(--warning); font-family: var(--font-mono); font-size: 0.78rem; margin-top: 8px; }
  .empty { color: var(--text-faint); text-align: center; padding: 48px 0; font-size: 0.85rem; }
</style>
<script defer src="/spider/bootstrap.js"></script>
</head>
<body class="hs-body">
<header class="hs-shell-bar">
  <a class="hs-shell-brand" href="/">
    <svg class="hs-shell-mark" viewBox="0 0 28 28" fill="none"><polygon points="14,2 26,9 26,19 14,26 2,19 2,9" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="14" r="3" fill="currentColor"/></svg>
    HyperSpace AGI
    <span class="hs-shell-scope">Conversazioni</span>
  </a>
  <nav class="hs-shell-nav" aria-label="Superfici HyperSpace">
    <a class="hs-shell-link" href="/">Desktop</a>
    <a class="hs-shell-link" href="/dashboard">Cockpit Mesh</a>
    <a class="hs-shell-link" href="/company">Company / Org</a>
    <a class="hs-shell-link" href="/workspace">Workspace</a>
    <a class="hs-shell-link" href="/activity">Activity</a>
    <a class="hs-shell-link active" href="/conversations">Conversazioni</a>
    <a class="hs-shell-link" href="/diario">Diario</a>
    <a class="hs-shell-link" href="/sites">Sites</a>
    <a class="hs-shell-link" href="/p2p-monitor">P2P Sync</a>
  </nav>
</header>
<div class="subbar">
  <span class="dot" id="dot"></span>
  <h1>Conversazioni dei chatbot</h1>
  <select id="channelFilter" class="hs-sel" style="width:auto;min-width:160px">
    <option value="">tutti i canali</option>
  </select>
  <span class="count" id="count"></span>
</div>
<div class="wrap" id="wrap"><div class="empty">Caricamento…</div></div>
<script>
  const wrap = document.getElementById('wrap');
  const dot = document.getElementById('dot');
  const count = document.getElementById('count');
  const filter = document.getElementById('channelFilter');
  function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function fillFilter(channels) {
    const current = filter.value;
    const options = ['<option value="">tutti i canali</option>']
      .concat((channels || []).map(c => `<option value="${esc(c)}"${c === current ? ' selected' : ''}>${esc(c)}</option>`));
    filter.innerHTML = options.join('');
    filter.value = current;
  }
  async function tick() {
    try {
      const q = filter.value ? '?channel=' + encodeURIComponent(filter.value) : '';
      const r = await fetch('/conversations/data' + q);
      const d = await r.json();
      const turns = d.turns || [];
      dot.className = 'dot';
      count.textContent = turns.length + ' turni' + (d.dropped ? ' · ' + d.dropped + ' scartati' : '');
      fillFilter(d.channels);
      if (!turns.length) {
        wrap.innerHTML = '<div class="empty">Nessuna conversazione ancora.</div>';
        return;
      }
      wrap.innerHTML = turns.map(t => `
        <div class="turn">
          <div class="meta">
            <span class="badge">${esc(t.channel)}</span>
            <span>${esc(t.surface)} · ${esc(t.chat)}</span>
            <span style="margin-left:auto">${esc(t.ts)}</span>
          </div>
          ${(t.messages || []).map(m => `
            <div class="msg">
              <div class="author">${esc(m.author)}</div>
              <div class="txt">${esc(m.text)}</div>
            </div>`).join('')}
          ${t.action === 'reply'
            ? `<div class="reply"><div class="lbl">risposta</div><div class="txt">${esc(t.text)}</div></div>`
            : `<div class="wait">azione: ${esc(t.action)}${t.reason ? ' — ' + esc(t.reason) : ''}</div>`}
        </div>`).join('');
    } catch (e) {
      dot.className = 'dot off';
      wrap.innerHTML = '<div class="empty">control-plane non raggiungibile</div>';
    }
  }
  filter.addEventListener('change', tick);
  tick();
  setInterval(tick, 4000);
</script>
</body>
</html>
