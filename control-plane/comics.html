<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperSpace Comic Builder</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#141822;--line:#2a3040;--text:#edf0f7;--muted:#929bad;--cyan:#00e6ee;--pink:#ff397d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#152a30,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}header h1{margin:0;font-size:18px}header a{margin-left:auto;color:var(--cyan)}main{max-width:1100px;margin:auto;padding:24px}.auth,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.auth{display:flex;gap:9px;margin-bottom:20px}.auth input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}input{background:#0c1017;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px}button,.button{border:0;border-radius:8px;padding:10px 13px;background:var(--cyan);color:#041113;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.card h2{font-size:17px;margin:0 0 7px}.card p,.meta{color:var(--muted)}.meta{font-size:12px;margin:9px 0}.actions{display:flex;gap:8px;margin-top:14px}.secondary{background:#242a38;color:var(--text)}#status{color:var(--muted);margin:10px 0 20px}
</style><script defer src="/spider/bootstrap.js"></script>
</head><body><header><span>💥</span><h1>HyperSpace Comic Builder</h1><a href="/">Desktop</a></header><main><div class="auth"><input id="token" type="password" placeholder="NETWORK_ADMIN_TOKEN"><button id="save">Salva token</button><button id="refresh" class="secondary">Aggiorna</button></div><section class="card" style="margin-bottom:20px"><h2>Nuovo fumetto</h2><form id="create"><p class="meta">Crea prima la storia; poi apri l’editor per impaginare e generare le vignette.</p><p><input name="title" required maxlength="120" placeholder="Titolo"></p><p><input name="premise" required maxlength="1200" placeholder="Premessa / conflitto centrale"></p><p><input name="style" maxlength="300" value="graphic novel" placeholder="Stile visivo"></p><button type="submit">Crea progetto</button></form></section><div id="status">Caricamento…</div><section class="grid" id="grid"></section></main><script>
const token=document.querySelector('#token'),grid=document.querySelector('#grid'),status=document.querySelector('#status');token.value=localStorage.getItem('hs-network-token')||'';const headers=()=>({'X-Hyperspace-Network-Token':token.value.trim()});document.querySelector('#save').onclick=()=>{localStorage.setItem('hs-network-token',token.value.trim());status.textContent='Token salvato in questo browser.'};document.querySelector('#refresh').onclick=load;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const r=await fetch('/comic/projects',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);status.textContent=`${d.projects.length} progetti`;grid.innerHTML=d.projects.map(p=>`<article class="card"><h2>${esc(p.title)}</h2><p>${esc(p.premise)}</p><div class="meta">${(p.episodes||[]).length} episodi · ${(p.characters||[]).length} personaggi · ${p.layout?'layout salvato':'layout da creare'}</div><div class="actions"><a class="button" href="${p.editor_url}">Modifica tavole</a>${p.episodes?.[0]?`<a class="button secondary" target="_blank" href="/comic/projects/${encodeURIComponent(p.id)}/episodes/${encodeURIComponent(p.episodes[0].id)}/preview">Anteprima</a>`:''}</div></article>`).join('')||'<p>Nessun fumetto: creane uno dalla chat WebUI.</p>'}catch(e){status.textContent='Errore: '+e.message}}
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));status.textContent='Creazione progetto…';try{const r=await fetch('/comic/projects',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);status.textContent='Progetto creato: apro l’editor…';location.href='/comic/editor?project='+encodeURIComponent(d.project.id)}catch(err){status.textContent='Errore: '+err.message}};
load();</script></body></html>
