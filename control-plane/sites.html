<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HyperSpace Sites Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cockpit.css">
<style>
  *{box-sizing:border-box}
  .layout{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:calc(100vh - 46px)}
  aside{padding:18px;border-right:1px solid var(--border);background:var(--surface);overflow:auto}
  .preview{padding:18px;display:flex;flex-direction:column;gap:12px}
  label{display:block;color:var(--text-muted);font-size:.72rem;font-weight:500;margin:11px 0 4px}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);padding:8px 10px;font:inherit;font-size:.82rem}
  textarea{min-height:96px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:8px;margin-top:14px}
  #status{min-height:20px;color:var(--text-muted);font-family:var(--font-mono);font-size:.75rem;margin-top:10px}
  .token{display:flex;gap:6px}
  .projects{margin-top:20px}
  .projects h3{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .project{border-top:1px solid var(--divider);padding:10px 4px;cursor:pointer;transition:background var(--tr)}
  .project:hover{background:var(--surface2)}
  .project b{display:block;font-size:.84rem}
  .project small{color:var(--text-muted);font-family:var(--font-mono);font-size:.72rem}
  iframe{width:100%;flex:1;min-height:660px;border:1px solid var(--border);border-radius:var(--radius-lg);background:white}
  .previewbar{display:flex;align-items:center;gap:8px}
  .previewbar strong{flex:1;font-size:.88rem}
  @media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--border)}.preview{min-height:680px}}
</style>
<script defer src="/spider/bootstrap.js"></script>
</head>
<body class="hs-body">
<header class="hs-shell-bar">
  <a class="hs-shell-brand" href="/">
    <svg class="hs-shell-mark" viewBox="0 0 28 28" fill="none"><polygon points="14,2 26,9 26,19 14,26 2,19 2,9" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="14" r="3" fill="currentColor"/></svg>
    HyperSpace AGI
    <span class="hs-shell-scope">Sites Builder</span>
  </a>
  <nav class="hs-shell-nav" aria-label="Superfici HyperSpace">
    <a class="hs-shell-link" href="/">Desktop</a>
    <a class="hs-shell-link" href="/dashboard">Cockpit Mesh</a>
    <a class="hs-shell-link" href="/company">Company / Org</a>
    <a class="hs-shell-link" href="/workspace">Workspace</a>
    <a class="hs-shell-link" href="/activity">Activity</a>
    <a class="hs-shell-link" href="/conversations">Conversazioni</a>
    <a class="hs-shell-link" href="/diario">Diario</a>
    <a class="hs-shell-link active" href="/sites">Sites</a>
    <a class="hs-shell-link" href="/p2p-monitor">P2P Sync</a>
  </nav>
</header>
<main class="layout"><aside>
  <label>Token amministrativo</label><div class="token"><input id="token" type="password" placeholder="X-Hyperspace-Network-Token"><button id="saveToken" class="hs-btn hs-btn-sm">salva</button></div>
  <form id="form">
    <label>Nome progetto</label><input name="name" required placeholder="Atelier Aurora">
    <label>Headline</label><input name="headline" placeholder="Idee che diventano presenza">
    <label>Brief</label><textarea name="brief" required placeholder="Cosa deve comunicare il sito, pubblico e tono…"></textarea>
    <div class="row"><div><label>Template</label><select name="template"><option value="showcase">Showcase</option><option value="landing">Landing page</option></select></div><div><label>Pulsante</label><input name="call_to_action" value="Contattaci"></div></div>
    <label>Raccolta immagini di Anna</label><select name="source_html" id="source"><option value="">Nessuna raccolta</option></select>
    <div class="actions"><button type="submit" class="hs-btn hs-btn-primary hs-btn-sm">Crea bozza</button><button type="button" class="hs-btn hs-btn-sm" id="refresh">Aggiorna</button></div>
  </form><div id="status"></div>
  <section class="projects"><h3>Progetti</h3><div id="projects"></div></section>
</aside><section class="preview"><div class="previewbar"><strong id="current">Nessuna anteprima</strong><a id="open" class="hs-btn hs-btn-sm" hidden target="_blank">Apri</a><a id="download" class="hs-btn hs-btn-primary hs-btn-sm" hidden>ZIP</a></div><iframe id="frame" title="Anteprima sito"></iframe></section></main>
<script>
const $=s=>document.querySelector(s), token=$('#token'), status=$('#status'), frame=$('#frame');
token.value=localStorage.getItem('hs-network-token')||'';
$('#saveToken').onclick=()=>{localStorage.setItem('hs-network-token',token.value.trim());status.textContent='Token salvato in questo browser.'};
const headers=()=>({'Content-Type':'application/json','X-Hyperspace-Network-Token':token.value.trim()});
function show(p){$('#current').textContent=p.name||p.id;frame.src=p.preview;$('#open').href=p.preview;$('#open').hidden=false;$('#download').href=p.download;$('#download').hidden=false}
async function load(){try{const r=await fetch('/website/projects',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);$('#source').innerHTML='<option value="">Nessuna raccolta</option>'+d.sources.map(x=>`<option>${x}</option>`).join('');$('#projects').innerHTML=d.projects.map((p,i)=>`<div class="project" data-i="${i}"><b>${p.name}</b><small>${p.template} · ${p.created_at||''} · ${(p.files||[]).length} file</small></div>`).join('')||'<small>Nessun progetto.</small>';document.querySelectorAll('.project').forEach(x=>x.onclick=()=>show(d.projects[+x.dataset.i]));status.textContent=`${d.projects.length} progetti disponibili`;return d}catch(e){status.textContent='Errore: '+e.message}}
$('#refresh').onclick=load;
$('#form').onsubmit=async e=>{e.preventDefault();status.textContent='Creazione in corso…';const body=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/website/projects',{method:'POST',headers:headers(),body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);show({id:d.project_id,name:body.name,preview:d.preview,download:d.download});status.textContent='Bozza creata.';await load()}catch(err){status.textContent='Errore: '+err.message}};
load();
</script></body></html>
