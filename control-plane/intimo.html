<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diario intimo · HyperSpace</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#141822;--line:#2a3040;--text:#edf0f7;--muted:#929bad;--accent:#ff7aad;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}header h1{font-size:18px;margin:0}header a{margin-left:auto;color:var(--accent)}.auth,.entry{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:18px}.auth{display:flex;gap:8px}.auth input{flex:1}input,button{font:inherit;padding:9px 11px;border-radius:8px}input{background:#0d1119;border:1px solid var(--line);color:var(--text)}button{border:0;background:var(--accent);color:#220914;font-weight:700;cursor:pointer}button.alt{background:#242a38;color:var(--text)}#status{color:var(--muted);margin-top:12px}.meta{color:var(--muted);font-size:12px}.failed{color:var(--bad)}.queued{color:#f6c85f}.delivered{color:#75dfae}.entry p{white-space:pre-wrap}.empty{color:var(--muted);padding:30px 0;text-align:center}
</style><script defer src="/spider/bootstrap.js"></script>
</head><body><header><span>🔒</span><h1>Diario intimo</h1><a href="/diario">Diario pubblico</a></header><main><div class="auth"><input id="token" type="password" placeholder="NETWORK_ADMIN_TOKEN"><button id="save">Salva token</button><button id="generate" class="alt">Genera una pagina</button></div><div id="status">Inserisci il token per leggere l’archivio privato.</div><section id="entries"></section></main><script>
const $=s=>document.querySelector(s),token=$('#token'),status=$('#status'),entries=$('#entries');token.value=localStorage.getItem('hs-network-token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const headers=()=>({'X-Hyperspace-Network-Token':token.value.trim()});$('#save').onclick=()=>{localStorage.setItem('hs-network-token',token.value.trim());load()};async function load(){try{const r=await fetch('/diario/intimo/data',{headers:headers()}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);const rows=d.voci||[];status.textContent=`${rows.length} pagine private`;entries.innerHTML=rows.map(v=>`<article class="entry"><div class="meta ${esc(v.stato)}">${esc(v.stato)} · ${esc(v.ts)} · ${esc(v.destinatario)}</div><p>${esc(v.testo)}</p>${v.errore?`<div class="meta failed">${esc(v.errore)}</div>`:''}</article>`).join('')||'<div class="empty">Nessuna pagina privata ancora.</div>'}catch(e){entries.innerHTML='';status.textContent='Errore: '+e.message}}$('#generate').onclick=async()=>{status.textContent='Generazione e accodamento…';try{const r=await fetch('/diario/intimo/genera',{method:'POST',headers:headers()}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);status.textContent='Pagina accodata; aggiorno lo stato.';await load()}catch(e){status.textContent='Errore: '+e.message}};load();
</script></body></html>
