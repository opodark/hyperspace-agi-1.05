# SearXNG — configurazione default per HyperSpace AGI
# Questo file viene montato in /etc/searxng/settings.yml nel container.
# NON richiede modifiche per il funzionamento di base.
# Documentazione: https://docs.searxng.org/admin/settings/

use_default_settings: true

general:
  debug: false
  instance_name: "HyperSpace AGI Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

ui:
  default_locale: "it"
  query_in_title: true
  infinite_scroll: false
  default_theme: simple

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "it-IT"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json        # <-- indispensabile per il tool web_search del control-plane

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET:-hyperspace-searxng-secret}"
  base_url: false
  image_proxy: false
  http_protocol_version: "1.1"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Engine abilitati — configurati per evitare blocchi CAPTCHA e risposte avvelenate
engines:
  - name: zapmeta
    weight: 2.0
    disabled: false

  - name: abcnyheter
    weight: 1.8
    disabled: false

  - name: yandex
    weight: 1.5
    disabled: false

  - name: wikipedia search
    engine: mediawiki
    shortcut: wpswiki
    base_url: "https://{language}.wikipedia.org/"
    search_type: text
    number_of_results: 5
    categories: [general, web]
    weight: 1.5
    disabled: false

  - name: wikipedia
    display_type: ["infobox", "list"]
    weight: 1.5
    disabled: false

  - name: wikiquote
    weight: 1.2
    disabled: false

  - name: wiktionary
    categories: [general, dictionaries, wikimedia]
    weight: 1.0
    disabled: false

  - name: google
    weight: 1.0
    disabled: false

  - name: github
    categories: [general, it, repos]
    weight: 1.0
    disabled: false

  # Disabilitati perché restituiscono CAPTCHA, HTTP 403/429 o risultati avvelenati (Bing)
  - name: duckduckgo
    disabled: true

  - name: startpage
    disabled: true

  - name: brave
    disabled: true

  - name: bing
    disabled: true

  - name: wikidata
    disabled: true


